name: Fit rating curves and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ratingcurve and dataretrieval
        run: pip install -r requirements.txt

      - name: Download gage data from USGS
        env:
          API_USGS_PAT: ${{ secrets.API_USGS_PAT }}   # optional; leave unset if you don't have one
        run: python scripts/fetch_usgs.py

      - name: Fit ratings and build site
        run: python scripts/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
